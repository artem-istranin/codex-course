name: Coverage report
description: Report overall branch coverage and PR diff coverage.

inputs:
  working-directory:
    description: Directory containing the coverage report.
    required: true
  coverage-file:
    description: Coverage XML file path, relative to working-directory.
    required: true
  compare-branch:
    description: Git ref used as the diff coverage comparison base.
    required: true
  github-token:
    description: GitHub token for updating pull request comments.
    required: true

outputs:
  coverage:
    description: Overall branch coverage percentage.
    value: ${{ steps.coverage.outputs.percentage }}
  pr-coverage:
    description: Pull request diff coverage percentage.
    value: ${{ steps.pr-coverage.outputs.percentage }}

runs:
  using: composite
  steps:
    - name: Read overall branch coverage
      id: coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import xml.etree.ElementTree as ET
        from urllib.parse import quote

        def color_for(value):
            if value >= 95:
                return "brightgreen"
            if value >= 85:
                return "yellow"
            return "red"

        root = ET.parse("${{ inputs.coverage-file }}").getroot()
        percentage = float(root.attrib["branch-rate"]) * 100
        text = f"{percentage:.2f}%"
        badge = (
            "https://img.shields.io/badge/"
            f"{quote('Coverage')}-{quote(text)}-{color_for(percentage)}"
        )

        print(f"percentage={percentage:.2f}")
        print(f"badge={badge}")
        PY

    - name: Generate PR coverage report
      if: github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: >
        uv run diff-cover "${{ inputs.coverage-file }}"
        --compare-branch="${{ inputs.compare-branch }}"
        --format json:pr-coverage.json

    - name: Read PR coverage
      id: pr-coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        import os
        from urllib.parse import quote

        def color_for(value):
            if value >= 95:
                return "brightgreen"
            if value >= 85:
                return "yellow"
            return "red"

        if os.path.exists("pr-coverage.json"):
            with open("pr-coverage.json", encoding="utf-8") as report_file:
                percentage = float(json.load(report_file)["total_percent_covered"])
            text = f"{percentage:.2f}%"
            color = color_for(percentage)
            output_percentage = f"{percentage:.2f}"
        else:
            text = "N/A"
            color = "lightgrey"
            output_percentage = "N/A"

        badge = (
            "https://img.shields.io/badge/"
            f"{quote('PR coverage')}-{quote(text)}-{color}"
        )

        print(f"percentage={output_percentage}")
        print(f"badge={badge}")
        PY

    - name: Publish Actions summary
      shell: bash
      run: |
        printf '![Coverage](%s) ![PR coverage](%s)\n' \
          '${{ steps.coverage.outputs.badge }}' \
          '${{ steps.pr-coverage.outputs.badge }}' >> "$GITHUB_STEP_SUMMARY"

    - name: Comment coverage on PR
      if: >
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = '<!-- coverage-report -->';
          const report = '![Coverage](${{ steps.coverage.outputs.badge }}) ![PR coverage](${{ steps.pr-coverage.outputs.badge }})';
          const body = `${marker}\n${report}`;

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
          });
          const existing = comments.find((comment) =>
            comment.user.type === 'Bot' && comment.body.includes(marker),
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }
