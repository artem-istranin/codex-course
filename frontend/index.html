<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wheel Winner</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="celebration-layer" id="celebration-layer" aria-hidden="true"></div>
    <section class="winner-overlay" id="winner-overlay" role="dialog" aria-modal="true" aria-labelledby="winner-overlay-title" hidden>
      <div class="winner-overlay-card">
        <p class="winner-overlay-eyebrow">We have a winner</p>
        <h2 id="winner-overlay-title">Congratulations!</h2>
        <p class="winner-overlay-name" id="winner-overlay-name"></p>
        <button id="close-celebration" type="button">Continue</button>
      </div>
    </section>

    <main class="app-shell">
      <section class="wheel-panel" aria-labelledby="app-title">
        <div class="wheel-stage">
          <canvas id="wheel" width="680" height="680" aria-label="Participant wheel"></canvas>
          <div class="pointer" aria-hidden="true"></div>
        </div>
        <div class="result" id="result" aria-live="polite">Add names and spin the wheel.</div>
      </section>

      <section class="controls-panel" aria-labelledby="app-title">
        <div class="heading">
          <p class="eyebrow">Randomizer</p>
          <h1 id="app-title">Wheel Winner</h1>
        </div>

        <label for="participants">Participants</label>
        <textarea id="participants" spellcheck="false">Alice
Bob
Clara
Dmitri
Elena
Fatima</textarea>

        <div class="actions">
          <button id="spin" type="button">Spin</button>
          <button id="sample" class="secondary" type="button">Sample</button>
        </div>

        <p class="error" id="error" role="alert"></p>

        <section class="winner-history" aria-labelledby="winner-history-title">
          <h2 id="winner-history-title">Winner order</h2>
          <p class="winner-history-empty" id="winner-history-empty">Spin the wheel to start the list.</p>
          <ol class="winner-list" id="winner-list"></ol>
        </section>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
