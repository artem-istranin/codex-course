name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Initialize foundation Terraform
        working-directory: infra/foundation
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=wheel-winner/foundation"

      - name: Apply foundation infrastructure
        working-directory: infra/foundation
        run: terraform apply -auto-approve

      - name: Read Artifact Registry repository
        id: foundation
        working-directory: infra/foundation
        run: |
          echo "repository=$(terraform output -raw artifact_registry_repository)" >> "$GITHUB_OUTPUT"

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push container image
        id: image
        env:
          REPOSITORY: ${{ steps.foundation.outputs.repository }}
        run: |
          image_uri="$REPOSITORY/wheel-winner:$GITHUB_SHA"
          docker build --tag "$image_uri" .
          docker push "$image_uri"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Initialize application Terraform
        working-directory: infra/application
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=wheel-winner/application"

      - name: Apply application infrastructure
        working-directory: infra/application
        env:
          TF_VAR_image_uri: ${{ steps.image.outputs.uri }}
        run: terraform apply -auto-approve

      - name: Read deployed service URL
        id: application
        working-directory: infra/application
        run: |
          echo "url=$(terraform output -raw service_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test deployment
        env:
          SERVICE_URL: ${{ steps.application.outputs.url }}
        run: curl --fail --silent --show-error "$SERVICE_URL/health"
