name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --dev --frozen

      - name: Run tests with branch coverage
        working-directory: backend
        run: uv run --frozen pytest --cov-report=xml:coverage.xml

      - name: Report coverage
        uses: ./.github/actions/coverage-report
        with:
          coverage-xml: backend/coverage.xml
          source-prefix: backend
          base-sha: ${{ github.event.pull_request.base.sha || '' }}
          github-token: ${{ github.token }}

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize bootstrap configuration
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate bootstrap configuration
        working-directory: infra/bootstrap
        run: terraform validate

      - name: Initialize foundation configuration
        working-directory: infra/foundation
        run: terraform init -backend=false -input=false

      - name: Validate foundation configuration
        working-directory: infra/foundation
        run: terraform validate

      - name: Initialize application configuration
        working-directory: infra/application
        run: terraform init -backend=false -input=false

      - name: Validate application configuration
        working-directory: infra/application
        run: terraform validate

  codex:
    name: Codex pull request review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pre-fetch base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          sandbox: read-only

  post_codex_feedback:
    name: Post Codex feedback
    if: needs.codex.outputs.final_message != ''
    needs: codex
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Post Codex feedback
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
